<!doctype html>
<html lang="de" class="
  scroll-smooth scheme-light
  dark:scheme-dark
" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (() => {
      let themeMode = null;
      try {
        themeMode = localStorage.getItem('themeMode');
      } catch {}
      const isDarkMode =
        themeMode === 'dark' ||
        (themeMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDarkMode);
    })();
  </script>

  <!-- Title, description, keywords, canonical link, the language dependent og tags and the structured data are set by the SeoService -->
  <meta name="author" content="Julian Scholz">

  <meta property="og:site_name" content="julian scholz.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://assets.julian-scholz.dev/images/og_header.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <base href="/">
  <link rel="alternate" hreflang="de" href="https://julian-scholz.dev">
  <link rel="alternate" hreflang="en" href="https://julian-scholz.dev/en/">
  <link rel="alternate" hreflang="x-default" href="https://julian-scholz.dev">

  <link rel="preconnect" href="https://assets.julian-scholz.dev">
  <link rel="preload" href="https://assets.julian-scholz.dev/fonts/geist/geist-sans/Geist-wght.woff2" as="font"
        type="font/woff2"
        crossorigin="anonymous">

  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicons/favicon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16.png">
  <link rel="apple-touch-icon" type="image/png" sizes="1024x1024" href="assets/favicons/favicon-1024.png">
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="assets/favicons/favicon-180.png">
  <link rel="apple-touch-icon" type="image/png" sizes="167x167" href="assets/favicons/favicon-167.png">
  <link rel="apple-touch-icon" type="image/png" sizes="152x152" href="assets/favicons/favicon-152.png">
</head>
<body class="
  overflow-x-hidden overflow-y-scroll bg-custom-light-dark
  text-custom-light-dark
  selection:bg-dark-void selection:text-vanilla
  dark:selection:bg-vanilla dark:selection:text-dark-void
"
>
<app-root ngCspNonce="DUMMY_NONCE_VALUE"></app-root>
</body>
</html>
