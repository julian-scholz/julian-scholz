<section class="px-5 py-0">
  <div #scrollTrigger [ngStyle]="{
    '--about-me-content-length': contentLength,
    '--about-me-buffer': buffer,
    '--about-me-ppc': ppc,
    '--about-me-pad': pad
  }"
       id="about-me-scroll-trigger"
       class="
         h-[calc(((var(--about-me-ppc)*var(--about-me-content-length)+(var(--about-me-pad)*var(--about-me-buffer)))*1px)+100vh)]
       "
  >
    <div
      class="
        sticky top-0 mx-auto my-0 grid min-h-lvh place-items-center text-[40px]
        leading-none font-bold
        lg:text-7xl
      "
    >
      <h2 class="sr-only">{{ secondSplitText }} {{ thirdSplitText }} {{ fourthSplitText }}</h2>
      <p class="sr-only" lang="en">{{ firstSplitText }}</p>
      <div class="text-center" aria-hidden="true">
        @for (detailListEntry of detailList; track detailListEntry) {
          <app-about-me-detail
            [scrollTrigger]="scrollTrigger"
            [detail]="detailListEntry"
            [ppc]="ppc"
          />
        }
      </div>
    </div>
  </div>
</section>
