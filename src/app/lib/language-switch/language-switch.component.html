<a [href]="targetUrl" [attr.hreflang]="targetLanguage" [attr.lang]="targetLanguage"
   (click)="keepCurrentSection($event)"
   class="
     group grid h-12 place-items-center px-2
     max-[374px]:px-1
   "><span class="
     rounded-sm border border-snow/30 px-1.5 py-1 text-xs leading-none
     font-medium text-snow shadow-[0_2px_0] shadow-dark-void-dark
     transition-[translate,box-shadow] duration-100
     group-hover:text-vanilla
     group-active:translate-y-0.5 group-active:shadow-none
   ">{{ targetLanguage | uppercase }}</span><span class="sr-only">, {{ description }}</span></a>
