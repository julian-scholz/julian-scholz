<a [href]="targetUrl" [attr.hreflang]="targetLanguage" [attr.lang]="targetLanguage"
   (click)="keepCurrentSection($event)"
   class="
     group grid h-12 place-items-center pr-3 pl-0.5 outline-none
     max-[374px]:pr-1.5 max-[374px]:pl-0
   "><span class="
     rounded-sm bg-vanilla px-1.5 py-1 text-[0.6875rem] leading-none font-black
     tracking-wide text-dark-void transition-[translate,background-color]
     duration-100
     group-hover:bg-vanilla-light
     group-focus-visible:outline-2 group-focus-visible:outline-offset-2
     group-focus-visible:outline-vanilla
     group-active:translate-y-px
   ">{{ targetLanguage | uppercase }}</span><span class="sr-only">, {{ description }}</span></a>
