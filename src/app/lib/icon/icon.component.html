<svg xmlns="http://www.w3.org/2000/svg" [attr.viewBox]="viewBox()"
     [attr.data-size]="size()" aria-hidden="true" focusable="false" class="
       box-content inline-block h-[1em] w-[1.25em] overflow-visible
       align-[-0.125em]
       data-[size=2xl]:align-[-0.3125em] data-[size=2xl]:text-[2em]
       data-[size=2xl]:leading-[calc(1em/32)]
       data-[size=sm]:align-[calc(-1em/14)] data-[size=sm]:text-[0.875em]
       data-[size=sm]:leading-[calc(1em/14)]
       data-[size=xl]:align-[-0.25em] data-[size=xl]:text-[1.5em]
       data-[size=xl]:leading-[calc(1em/24)]
       data-[size=xs]:align-[0em] data-[size=xs]:text-[0.75em]
       data-[size=xs]:leading-[calc(1em/12)]
     ">
  @for (path of paths(); track $index) {
    <path fill="currentColor" [attr.d]="path" />
  }
</svg>
