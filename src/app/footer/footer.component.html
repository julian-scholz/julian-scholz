<!-- A dark panel with the scanlines of the teletext above it -->
<footer class="
  relative grid gap-3 overflow-hidden rounded-2xl bg-dark-void-dark/90 p-5
  text-center font-mono text-[0.6875rem]/snug tracking-[0.12em] text-snow/70
  uppercase
  after:pointer-events-none after:absolute after:inset-0
  after:bg-[repeating-linear-gradient(to_bottom,transparent_0_2px,--theme(--color-snow/0.03)_2px_3px)]
  sm:px-7 sm:text-xs/snug sm:tracking-[0.18em]
">
  <button i18n="@@footerCopyright" (click)="openInspirationsModal()" class="
    justify-self-center text-snow/50 uppercase transition-colors duration-300
    hover:text-vanilla
    focus-visible:text-vanilla
  ">JS-001 · © {{ currentYear }} Julian Scholz</button>
  <div class="
    flex justify-center gap-6.5 text-lg
    sm:gap-7.5 sm:text-xl
  ">
    @for (footerLink of sortedFooterLinkEntries; track footerLink) {
      <a [href]="footerLink.url" target="_blank" [attr.aria-label]="footerLink.name" class="
        transition-colors duration-300
        hover:text-vanilla
        focus-visible:text-vanilla
      ">
        <app-icon [icon]="footerLink.iconDefinition" />
      </a>
    }
  </div>
  <div class="
    flex flex-wrap justify-center gap-x-5.5 gap-y-1.5
    *:transition-colors *:duration-300
    *:hover:text-vanilla
    *:focus-visible:text-vanilla
  ">
    <button i18n="@@legalNoticeTitle" (click)="openLegalNoticeModal()" class="
      uppercase
    ">Impressum</button>
    <button i18n="@@privacyPolicyTitle" (click)="openPrivacyPolicyModal()" class="
      uppercase
    ">Datenschutzerklärung</button>
    <a href="mailto:mail@julian-scholz.dev">mail&#64;julian-scholz.dev</a>
  </div>
</footer>
