<div #shelfElement [attr.data-lit]="isShelfLit() || null" class="
  group/shelf relative mx-auto my-5 w-fit border-b-[0.75rem] border-solid
  border-b-dark-void-dark bg-transparent
  [transition:--shelf-light-x_0.6s_ease-out]
  before:pointer-events-none before:absolute before:inset-x-10 before:top-1/3
  before:bottom-6 before:hidden
  before:bg-[radial-gradient(ellipse_at_var(--shelf-light-x)_100%,--theme(--color-vanilla/0.3),transparent_70%)]
  before:opacity-0 before:blur-xl before:transition-opacity before:duration-1000
  after:absolute after:inset-x-8 after:-bottom-3 after:h-2.5
  after:transform-[rotateX(-25deg)] after:bg-transparent
  after:shadow-[0_0_1rem_0.125rem] after:shadow-dark-void
  data-lit:before:opacity-100
  motion-safe:data-lit:before:animate-[shelfLightOn_1.4s_linear_both]
  dark:border-b-dark-void-light/60
  dark:before:block
  dark:after:shadow-transparent
" (focusin)="isShelfLit.set(true)">
  <div class="
    after:relative after:block after:border-b-[1.5rem] after:border-solid
    after:border-b-dark-void after:bg-dark-void
    after:[clip-path:polygon(1.5rem_0,calc(100%-1.5rem)_0,100%_100%,0_100%)]
    dark:after:border-b-dark-void-light dark:after:bg-dark-void-light
  ">
    <div [ngStyle]="{
      '--shelf-book-gap': bookGap() + 'px',
      '--shelf-margin-left': shelfMarginLeft() + 'px',
      '--shelf-margin-right': shelfMarginRight() + 'px'
    }"
         class="
           relative top-3 mr-(--shelf-margin-right) ml-(--shelf-margin-left)
           flex items-end justify-center gap-(--shelf-book-gap)
           *:shrink-0
           motion-safe:[&>:has(+:hover)>article]:rotate-[-1.5deg]
           motion-safe:[&>:hover+*>article]:origin-bottom-right
           motion-safe:[&>:hover+*>article]:rotate-[1.5deg]
         ">
      @for (bookDetailEntry of bookDetails(); track bookDetailEntry; let i = $index) {
        <app-book-recommendations-book [bookIndex]="i" [bookWidth]="bookWidth()"
                                       [bookDetails]="bookDetailEntry"
        />
      }
    </div>
  </div>
  <div aria-hidden="true" class="
    pointer-events-none absolute inset-x-8 top-[calc(100%+0.75rem)] hidden h-24
    bg-[radial-gradient(ellipse_at_50%_0%,--theme(--color-vanilla/0.15),transparent_70%)]
    opacity-0 transition-opacity duration-1000
    group-data-lit/shelf:opacity-100
    before:absolute before:inset-x-0 before:top-0 before:h-0.5
    before:rounded-full before:bg-vanilla-light
    before:shadow-[0_0_0.5rem_0.125rem_--theme(--color-vanilla/0.6)]
    motion-safe:group-data-lit/shelf:animate-[shelfLightOn_1.4s_linear_both]
    dark:block
  ">
    @for (dustParticle of dustParticles; track dustParticle) {
      <span [ngStyle]="{
        'left': dustParticle.left + '%',
        'top': dustParticle.top + '%',
        '--dust-size': dustParticle.size + 'px',
        '--dust-duration': dustParticle.duration + 's',
        '--dust-delay': dustParticle.delay + 's'
      }"
            class="
              absolute size-(--dust-size) rounded-full bg-vanilla-light
              opacity-0 shadow-[0_0_0.25rem_--theme(--color-vanilla/0.8)]
              motion-safe:animate-[shelfDustFloat_var(--dust-duration)_ease-in-out_var(--dust-delay)_infinite]
            "></span>
    }
  </div>
</div>
