<div
  class="
    bg-linear-to-r from-dark-void to-vanilla-darker py-20 text-center text-base
    dark:from-dark-void-light dark:to-vanilla-dark
  ">
  <!-- 7" singles standing one behind the other on a stand, the record of the
       hovered or focused link lifts out of its sleeve. The stack rises above
       its layout box in 3d, so it moves down to sit in the middle of the band -->
  <ul [style.--sleeve-count]="sortedNavEntries.length"
      (pointerenter)="isBrowsedByUser = true"
      (pointerleave)="isBrowsedByUser = false"
      (focusin)="isBrowsedByUser = true" (focusout)="isBrowsedByUser = false" class="
        relative mx-auto size-(--sleeve) translate-y-[calc(var(--sleeve)*0.3)]
        header-nav-scene [--sleeve-depth:calc(var(--sleeve)*0.07)]
        [--sleeve-gap:calc(var(--sleeve)*0.32)]
        [--sleeve-radius:calc(var(--sleeve)*0.06)] [--sleeve:7rem]
        [--stand-height:calc(var(--sleeve)*0.11)]
        [--stand-padding-back:calc(var(--sleeve)*0.14)]
        [--stand-padding:calc(var(--sleeve)*0.05)]
        sm:[--sleeve:9rem]
      ">
    <li aria-hidden="true" class="
      iso-box
      [--box-d:calc(var(--sleeve-count)*var(--sleeve-depth)+(var(--sleeve-count)-1)*var(--sleeve-gap)+var(--stand-padding)+var(--stand-padding-back))]
      [--box-h:var(--stand-height)]
      [--box-w:calc(var(--sleeve)+2*var(--stand-padding))]
      [--box-x:calc(var(--stand-padding)*-1)]
      [--box-y:calc(var(--stand-padding-back)*-1)]
      [--box-z:calc(var(--stand-height)*-1)]
    ">
      <span class="
        absolute top-0 left-0 h-(--box-d) w-(--box-w) -translate-z-px scale-105
        rounded-xl bg-dark-void/50 blur-lg
      "></span>
      <span class="
        iso-box-top
        bg-[linear-gradient(color-mix(in_oklab,var(--color-dark-void-light)_60%,var(--color-dark-void)),var(--color-dark-void-light))]
      "></span>
      <span class="
        iso-box-side bg-dark-void
        dark:bg-[color-mix(in_oklab,var(--color-dark-void-light)_40%,var(--color-dark-void))]
      "></span>
      <span class="
        iso-box-front
        bg-[color-mix(in_oklab,var(--color-dark-void-light)_35%,var(--color-dark-void))]
        dark:bg-[color-mix(in_oklab,var(--color-dark-void-light)_60%,var(--color-dark-void))]
      "></span>
    </li>
    @for (navEntry of sortedNavEntries; track navEntry; let i = $index) {
      <li [style.--sleeve-index]="i"
          [style.animation-delay.ms]="sleeveDropDelay + i * sleeveDropStagger"
          [attr.data-peek]="peekedSleeve() === i || null" class="
            group iso-box [--box-d:var(--sleeve-depth)] [--box-h:var(--sleeve)]
            [--box-r:var(--sleeve-radius)] [--box-w:var(--sleeve)]
            [--box-y:calc(var(--sleeve-index)*(var(--sleeve-depth)+var(--sleeve-gap)))]
            hover:[--record-lift:calc(var(--sleeve)*0.55)]
            has-focus-visible:[--record-lift:calc(var(--sleeve)*0.55)]
            has-active:[--record-lift:calc(var(--sleeve)*0.55)]
            data-peek:[--record-peek:calc(var(--sleeve)*0.25)]
            motion-safe:animate-[headerNavSleeveDrop_0.7s_ease-in_both]
          ">
        <span aria-hidden="true" class="
          iso-box-back bg-dark-void
          dark:bg-dark-void-light
        "></span>
        <span aria-hidden="true" class="
          header-nav-record grid place-items-center rounded-full
          bg-dark-void-dark transition-transform duration-500 ease-out
          backface-hidden
          motion-reduce:transition-none
        ">
          <span class="
            absolute inset-[2%] rounded-full
            bg-[repeating-radial-gradient(circle,rgb(255_255_255/0.07)_0_0.6px,transparent_0.6px_2.4px)]
          "></span>
          <span class="
            absolute inset-0 rounded-full
            bg-[conic-gradient(from_-60deg,transparent_0_6%,rgb(255_255_255/0.16)_12%,transparent_18%_56%,rgb(255_255_255/0.16)_62%,transparent_68%)]
          "></span>
          <span class="
            relative grid size-[34%] place-items-center rounded-full bg-vanilla
            text-[calc(var(--sleeve)*0.16)] text-dark-void
            dark:bg-snow
          "><app-icon [icon]="navEntry.iconDefinition" /></span>
        </span>
        <span aria-hidden="true" class="iso-box-top header-nav-sleeve-opening"></span>
        <span aria-hidden="true" class="
          iso-box-side bg-dark-void-dark
          dark:bg-dark-void
        "></span>
        <a [href]="navEntry.url" target="_blank" [attr.aria-label]="navEntry.name" class="
          iso-box-front flex flex-col justify-between bg-dark-void
          bg-[linear-gradient(115deg,rgb(255_255_255/0.07),transparent_35%_65%,rgb(255_255_255/0.03))]
          p-[12%] text-left text-snow
          shadow-[inset_0_0_0_1px_rgb(251_251_251/0.07)] outline-none
          backface-hidden
          focus-visible:outline-2 focus-visible:outline-offset-2
          focus-visible:outline-vanilla
          dark:bg-dark-void-light
        ">
          <span class="
            font-mono text-[calc(var(--sleeve)*0.08)] tracking-[0.15em]
            opacity-55
          ">JS-00{{ i + 2 }}</span>
          <span class="
            flex items-center gap-[8%] text-[calc(var(--sleeve)*0.22)]
            transition-colors duration-300
            group-hover:text-vanilla
            group-has-focus-visible:text-vanilla
          "><app-icon [icon]="navEntry.iconDefinition" /></span>
        </a>
      </li>
    }
  </ul>
</div>
