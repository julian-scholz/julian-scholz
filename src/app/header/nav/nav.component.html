<!-- A waveform from dark to vanilla, with the social links as records on it,
     on phones in a row below it. The records play one after another: the
     playing one turns, the bars jump where the playback is and are coloured
     behind it -->
<div class="
  relative flex flex-col items-center justify-center gap-3.5 bg-snow py-3
  sm:h-47.5 sm:flex-row sm:py-0
  dark:bg-dark-void
">
  <div #wave aria-hidden="true" class="
    relative flex h-25 w-full items-center
    sm:absolute sm:inset-x-0 sm:top-1/2 sm:h-35 sm:-translate-y-1/2
  ">
    @for (bar of bars; track $index) {
      <span #bar
            [style.--bar-x]="bar.x"
            [style.--bar-distance]="bar.distance"
            [style.--bar-noise]="bar.noise"
            [style.animation-delay.ms]="barRiseDelay + bar.distance * barRiseSpread"
            class="
              header-nav-bar
              motion-safe:animate-[headerNavBarRise_0.6s_ease-out_backwards]
              max-sm:odd:hidden
            "></span>
    }
  </div>
  <ul class="
    relative flex gap-4
    sm:gap-10
  ">
    @for (navEntry of sortedNavEntries; track navEntry; let i = $index) {
      <li #record
          [attr.data-playing]="playingRecord() === i || null"
          (pointerenter)="swell(i)" (pointerleave)="swell(null)"
          (focusin)="swell(i)" (focusout)="swell(null)" class="group">
        <a [href]="navEntry.url" target="_blank" [attr.aria-label]="navEntry.name"
           [style.animation-delay.ms]="recordDropDelay + i * recordDropStagger" class="
             relative grid size-17 place-items-center rounded-full
             bg-dark-void-dark ring-5 ring-snow transition-[scale] duration-500
             ease-out outline-none
             group-hover:scale-106
             focus-visible:outline-2 focus-visible:outline-offset-9
             focus-visible:outline-vanilla
             motion-safe:animate-[headerNavRecordDrop_0.5s_ease-out_backwards]
             motion-reduce:transition-none
             sm:size-19 sm:ring-7
             dark:ring-dark-void
           ">
          <span aria-hidden="true" class="
            absolute inset-[2%] rounded-full
            bg-[repeating-radial-gradient(circle,rgb(255_255_255/0.07)_0_0.6px,transparent_0.6px_2.4px)]
          "></span>
          <span aria-hidden="true" class="
            relative grid size-[40%] place-items-center rounded-full bg-vanilla
            text-sm text-dark-void transition-[rotate,background-color]
            duration-600 ease-[cubic-bezier(0.3,0.7,0.2,1)]
            group-hover:rotate-200 group-hover:bg-snow
            group-has-focus-visible:rotate-200 group-has-focus-visible:bg-snow
            group-data-playing:bg-vanilla-light
            motion-safe:group-data-playing:animate-[headerNavLabelSpin_1.8s_linear_infinite]
            motion-reduce:transition-none
            sm:text-[0.9375rem]
          "><app-icon [icon]="navEntry.iconDefinition" /></span>
          <!-- The sheen stays put while the label turns below it -->
          <span aria-hidden="true" class="
            pointer-events-none absolute inset-0 rounded-full
            bg-[conic-gradient(from_-60deg,transparent_0_6%,rgb(255_255_255/0.16)_12%,transparent_18%_56%,rgb(255_255_255/0.16)_62%,transparent_68%)]
          "></span>
        </a>
      </li>
    }
  </ul>
</div>
