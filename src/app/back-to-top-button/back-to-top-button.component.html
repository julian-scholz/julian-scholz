<div
  [ngStyle]="{'--back-to-top-button-right-offset-multiplier': isVisible() ? '1' : '-3'}"
  class="
    fixed
    right-[calc(1.5rem*(var(--back-to-top-button-right-offset-multiplier)))]
    bottom-6 z-50 flex size-17 items-center justify-center transition-[right]
    duration-1000
    2xl:right-[calc(5rem*(var(--back-to-top-button-right-offset-multiplier)))]
    2xl:bottom-20
  "
>
  <svg class="size-full" viewBox="0 0 100 100">
    <circle
      class="fill-dark-void-dark stroke-transparent"
      stroke-width="6"
      cx="50"
      cy="50"
      [attr.r]="radiusOuterCircle"
    ></circle>
    <circle
      class="
        origin-[50%_50%] -rotate-90 fill-transparent stroke-vanilla-light
        transition-[stroke-dashoffset] duration-500 ease-out
      "
      stroke-width="4"
      stroke-linecap="round"
      cx="50"
      cy="50"
      [attr.r]="radiusInnerCircle"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="strokeDashoffset()"
    ></circle>
  </svg>
  <!-- Inside the progress ring lie the grooves of a record -->
  <span aria-hidden="true" class="
    absolute size-10 rounded-full
    bg-[repeating-radial-gradient(circle,rgb(255_255_255/0.07)_0_0.6px,transparent_0.6px_2.4px)]
  "></span>
  <span aria-hidden="true" class="
    pointer-events-none absolute size-10 rounded-full
    bg-[conic-gradient(from_-60deg,transparent_0_6%,rgb(255_255_255/0.16)_12%,transparent_18%_56%,rgb(255_255_255/0.16)_62%,transparent_68%)]
  "></span>
  <button
    class="
      absolute flex size-12 items-center justify-center rounded-full
      bg-transparent
    "
    (click)="navigateToTop()" i18n-aria-label="@@backToTopLabel" aria-label="Zurück zum Seitenanfang"
    [attr.tabindex]="isVisible() ? null : -1">
    <span class="
      grid size-5 place-items-center rounded-full bg-vanilla text-xs
      text-dark-void
    ">
      <app-icon [icon]="faCaretUp" />
    </span>
  </button>
</div>
