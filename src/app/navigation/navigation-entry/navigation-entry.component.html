<div
  [ngStyle]="{
    '--header-nav-i': navigationEntryIndex(),
    '--header-nav-active': active() ? 1 : 0
  }"
  class="
    h-full opacity-(--header-nav-expanded) transition-opacity
    delay-[calc(750ms+(var(--header-nav-i)*50ms))] duration-200
    *:hover:opacity-100
    *:focus-visible:opacity-100
  "
>
  <a [href]="'#' + navigationEntry().id"
     [attr.aria-current]="active() ? 'location' : null"
     class="
       relative grid size-full place-items-center whitespace-nowrap text-snow
       no-underline opacity-[calc(0.55+(var(--header-nav-active)))]
       transition-opacity duration-200
     "
     (click)="navigateTo($event)">
    <span>{{ navigationEntry().title }}</span>
    <span aria-hidden="true" class="
      absolute inset-x-3 bottom-2 h-px bg-snow/15 opacity-(--header-nav-active)
      transition-opacity duration-500
    ">
      <span #groove class="
        block h-full origin-left scale-x-(--navigation-entry-progress)
        bg-vanilla/50 [--navigation-entry-progress:0]
      "></span>
    </span>
  </a>
</div>
