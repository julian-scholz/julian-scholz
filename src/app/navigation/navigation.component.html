<div class="
  sticky top-0 z-40 flex justify-center py-5 [--header-nav-item-width:4.25rem]
  [--header-nav-logo-gap:0.5rem] [--header-nav-ul-gap:0.25rem]
  sm:[--header-nav-item-width:5rem] sm:[--header-nav-logo-gap:0.75rem]
  sm:[--header-nav-ul-gap:1rem]
  2xl:bottom-8
"
>
  <nav [ngStyle]="{'--header-nav-expanded': navbarExpanded()}"
       class="
         flex h-12 overflow-hidden rounded-5xl bg-dark-void pl-0 text-sm
         has-focus-visible:[--header-nav-expanded:1]!
         max-[374px]:text-xs max-[374px]:[--header-nav-item-width:3.75rem]
         dark:bg-dark-void-light
       "
  >
    <div [ngStyle]="{'--header-nav-item-count': sortedRouteEntries.length}"
         class="
           grid
           grid-cols-[auto_calc(var(--header-nav-expanded)*(var(--header-nav-item-count)*var(--header-nav-item-width)))_auto]
           transition-[grid-template-columns] duration-1000
           ease-header-nav-function
         "
    >
      <button class="
        group grid w-[calc(--spacing(10)+var(--header-nav-logo-gap))]
        place-items-center pl-(--header-nav-logo-gap) outline-none
      " (click)="navigateToTop()"
              i18n-aria-label="@@backToTopLabel" aria-label="Zurück zum Seitenanfang">
        <span class="
          grid size-10 place-items-center rounded-full bg-dark-void-dark
          shadow-[inset_0_1px_3px_rgb(0_0_0/0.6)]
          group-focus-visible:outline-2 group-focus-visible:outline-offset-2
          group-focus-visible:outline-vanilla
          dark:bg-dark-void
        ">
        <span #record class="
          relative grid size-9 place-items-center
          [--navigation-record-turn:0deg]
        ">
          <span aria-hidden="true" class="
            grid size-full rotate-(--navigation-record-turn) place-items-center
            rounded-full bg-dark-void-dark
          ">
            <span class="
              absolute inset-[2%] rounded-full
              bg-[repeating-radial-gradient(circle,rgb(255_255_255/0.07)_0_0.6px,transparent_0.6px_2.4px)]
            "></span>
            <span class="
              relative grid size-4
              rotate-[calc(var(--header-nav-intent,0)*360deg)]
              place-items-center rounded-full bg-vanilla text-[0.5rem]
              leading-none font-black tracking-tight text-dark-void
              transition-transform duration-500
              hover:[--header-nav-intent:1]
            ">JS</span>
          </span>
          <!-- The sheen stays put while the record turns below it -->
          <span aria-hidden="true" class="
            pointer-events-none absolute inset-0 rounded-full
            bg-[conic-gradient(from_-60deg,transparent_0_6%,rgb(255_255_255/0.16)_12%,transparent_18%_56%,rgb(255_255_255/0.16)_62%,transparent_68%)]
          "></span>
        </span>
        </span>
      </button>
      <div class="relative">
        <ul class="
          m-0 flex h-full list-none items-center px-(--header-nav-ul-gap) py-0
        ">
          @for (navigationEntry of sortedRouteEntries; track navigationEntry; let i = $index; let isLast = $last) {
            <li
              class="size-full">
              <app-navigation-entry
                [navigationEntry]="navigationEntry"
                [navigationEntryIndex]="i"
                [navigationLastEntry]="isLast"
                (activeChange)="setEntryActive(i, $event)"
                (progressChange)="moveArm(i, $event)"
              />
            </li>
          }
        </ul>
        <!-- The stylus rides the groove of the active entry -->
        <div aria-hidden="true" class="
          pointer-events-none absolute inset-x-(--header-nav-ul-gap) inset-y-0
          opacity-(--header-nav-expanded) transition-opacity
          delay-[calc(750ms+(var(--header-nav-item-count)*50ms))] duration-200
          [--navigation-arm-slot:calc(100%/var(--header-nav-item-count))]
        ">
          <!-- The stylus follows the scroll directly and only glides when it
               moves on to another entry. Its index, progress and glide are set
               by the component -->
          <span #arm class="
            absolute bottom-2
            left-[calc(var(--navigation-arm-index)*var(--navigation-arm-slot)+0.75rem+var(--navigation-arm-progress)*(var(--navigation-arm-slot)-1.5rem))]
            flex -translate-x-1/2 flex-col items-center
            transition-[translate,opacity] duration-300 ease-out
            [--navigation-arm-index:0] [--navigation-arm-progress:0]
            data-jumping:transition-[left,translate,opacity]
            motion-reduce:transition-none
          " [class]="armDown()
            ? 'translate-y-0 opacity-100'
            : '-translate-y-1 opacity-0'">
            <span class="h-0.75 w-2 rounded-[1px] bg-vanilla"></span>
            <span class="h-1 w-px bg-vanilla"></span>
          </span>
        </div>
      </div>
      <div class="
        relative flex items-center gap-x-0 gap-y-(--header-nav-logo-gap)
        bg-dark-void px-(--header-nav-logo-gap) transition-[padding]
        duration-1000 ease-header-nav-function
        before:absolute before:right-full before:h-12 before:w-14
        before:origin-[100%_50%]
        before:scale-[calc(1-var(--header-nav-expanded))_1]
        before:transition-[scale] before:duration-200
        dark:bg-dark-void-light
      "
      >
        <app-language-switch/>
        <app-theme-mode-toggle/>
      </div>
    </div>
  </nav>
</div>
