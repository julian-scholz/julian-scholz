<section class="max-w-[unset] px-0 pb-0">
  <div class="container mx-auto px-8">
    <h2 i18n="@@favoritesHeading">Favoriten</h2>
    <div class="divider"></div>
  </div>
  <div #favoritesScrollTrigger id="favorites-scroll-trigger"
       [ngStyle]="foregroundImageStyles"
       class="
         relative overflow-hidden
         *:w-full
       ">
    <section [ngStyle]="{
      '--favorites-grid-wrapper-z-index': showFavoritesOverlay() ? '30' : '10',
    }"
             (focusin)="zoomInForFocusedOverlay()"
             class="
               absolute inset-x-0 z-(--favorites-grid-wrapper-z-index) h-svh
               px-5
               landscape:h-lvh
             ">
      <div class="
        flex h-full flex-col items-center gap-5
        *:relative *:flex *:max-w-full *:flex-auto *:items-center
        *:overflow-hidden
        short:flex-row short:justify-center
      ">
        <div class="short:hidden"></div>
        <app-favorites-overlay
          [attr.data-channel-on]="showFavoritesOverlay() || null"
          class="
            w-96 opacity-0
            data-channel-on:opacity-100 data-channel-on:transition-opacity
            data-channel-on:delay-300 data-channel-on:duration-0
            2xl:w-140
            short:flex-none
          "
        />
        <app-footer
          [attr.data-channel-on]="showFavoritesOverlay() || null"
          class="
            shrink-0! opacity-0
            data-channel-on:opacity-100 data-channel-on:transition-opacity
            data-channel-on:delay-300 data-channel-on:duration-0
            short:flex-none
          "
        />
      </div>
    </section>
    <div class="h-lvh"></div>
    <div [ngStyle]="{
      '--favorites-wrapper-z-index': showFavoritesOverlay() ? '10' : '20'
    }"
         class="
           absolute top-0 grid h-lvh place-items-center
           *:relative *:col-start-1 *:row-start-1
           *:aspect-(--favorites-tv-aspect-ratio)
           *:w-[min(100%,calc(100lvh*var(--favorites-tv-aspect-ratio)))]
         ">
      <div data-favorites-tv class="
        z-0 bg-dark-void-dark favorites-tv-screen-clip
      ">
        <div id="favorites-image-section"
             [attr.data-tv-on]="showBackgroundImage() || null"
             [attr.data-tv-off]="showBackgroundImage() === false || null"
             class="
               absolute top-1/2 left-1/2 h-lvh w-screen -translate-1/2 opacity-0
               data-tv-on:opacity-100
               motion-safe:data-tv-off:animate-[favoritesTvOff_0.6s_ease-in_both]
               motion-safe:data-tv-on:animate-[favoritesTvOn_1.2s_ease-out_both]
               motion-reduce:transition-opacity motion-reduce:duration-700
             ">
          @for (path of backgroundImagePaths(); track $index) {
            <img [ngSrc]="path"
                 ngSrcset="2560w, 1920w" sizes="100vw" fill
                 [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}"
                 [attr.data-active]="$index === activeBackgroundImageIndex() || null"
                 [alt]="$index === activeBackgroundImageIndex() ? backgroundImageAlt : ''"
                 class="
                   object-cover opacity-0
                   data-active:opacity-100
                 ">
          }
          @if (channelSwitchId()) {
            @for (id of [channelSwitchId()]; track id) {
              <div class="
                favorites-tv-static absolute inset-0
                motion-reduce:hidden
              "></div>
            }
          }
          <div class="absolute inset-0 favorites-tv-crt"></div>
        </div>
      </div>
      <div data-favorites-tv class="z-(--favorites-wrapper-z-index)">
        <img [ngSrc]="lightForegroundImagePath"
             ngSrcset="2560w, 1920w" sizes="100vw" fill
             [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}"
             class="
               will-change-transform
               dark:opacity-0
             "
             i18n-alt="@@favoritesTvAlt"
             alt="Retro-Fernseher mit ausgeschnittenem Bildschirm.">
        <img [ngSrc]="darkForegroundImagePath"
             ngSrcset="2560w, 1920w" sizes="100vw" fill
             [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}"
             class="
               opacity-0 will-change-transform
               dark:opacity-100
             "
             alt="">
      </div>
    </div>
  </div>
</section>
