<section class="max-w-[unset] px-0 pb-0">
  <div class="container mx-auto px-8">
    <h2>Favoriten</h2>
    <div class="divider"></div>
  </div>
  <div #favoritesScrollTrigger id="favorites-scroll-trigger"
       [ngStyle]="foregroundImageStyles"
       class="
         relative overflow-hidden
         *:w-full
       ">
    <section id="favorites-overlay-section"
             [ngStyle]="{
      '--favorites-grid-wrapper-z-index': showFavoritesOverlay() ? '30' : '10',
    }"
             [attr.data-behind-tv]="!showFavoritesOverlay() || null"
             class="
               absolute inset-x-0 z-(--favorites-grid-wrapper-z-index) h-svh
               px-5
               data-behind-tv:favorites-tv-screen-viewport-clip
               landscape:h-lvh
             ">
      <div [ngStyle]="{
      '--favorites-child-opacity': showFavoritesOverlay() ? '1' : '0',
      '--favorites-child-top': showFavoritesOverlay() ? '0' : '100%'
    }"
           class="
             flex h-full flex-col items-center gap-5
             *:relative *:flex *:max-w-full *:flex-auto *:items-center
             *:overflow-hidden
             short:flex-row short:justify-center
           ">
        <div class="short:hidden"></div>
        <app-favorites-overlay
          [isVisible]="showFavoritesOverlay()"
          class="
            top-(--favorites-child-top) w-96 opacity-(--favorites-child-opacity)
            transition-[opacity,top] duration-1500
            2xl:w-140
            short:flex-none
          "
        />
        <app-footer
          class="
            top-(--favorites-child-top) shrink-0!
            opacity-(--favorites-child-opacity) transition-[opacity,top]
            delay-500 duration-1500
            short:flex-none
          "
        />
      </div>
    </section>
    <div class="h-lvh"></div>
    <div [ngStyle]="{
      '--favorites-wrapper-z-index': showFavoritesOverlay() ? '10' : '20'
    }"
         class="
           absolute top-0 grid h-lvh place-items-center
           *:relative *:col-start-1 *:row-start-1
           *:aspect-(--favorites-tv-aspect-ratio)
           *:w-[min(100%,calc(100lvh*var(--favorites-tv-aspect-ratio)))]
         ">
      <div data-favorites-tv class="z-0 favorites-tv-screen-clip">
        <div id="favorites-image-section"
             [attr.data-tv-on]="showBackgroundImage() || null"
             class="
               absolute top-1/2 left-1/2 h-lvh w-screen -translate-1/2 opacity-0
               data-tv-on:opacity-100
               motion-safe:data-tv-on:animate-[favoritesTvOn_1.2s_ease-out_both]
               motion-reduce:transition-opacity motion-reduce:duration-700
             ">
          @if (selectedBackgroundImagePath) {
            <img [ngSrc]="selectedBackgroundImagePath"
                 ngSrcset="2560w, 1920w" sizes="100vw" fill
                 [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}" priority
                 class="object-cover" alt="Landschaft mit weitem Blick in die Ferne.">
          }
        </div>
      </div>
      <div data-favorites-tv class="z-(--favorites-wrapper-z-index)">
        <img [ngSrc]="lightForegroundImagePath"
             ngSrcset="2560w, 1920w" sizes="100vw" fill
             [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}" priority
             class="
               will-change-transform
               dark:opacity-0
             "
             alt="Retro-Fernseher mit ausgeschnittenem Bildschirm.">
        <img [ngSrc]="darkForegroundImagePath"
             ngSrcset="2560w, 1920w" sizes="100vw" fill
             [loaderParams]="{dynamicWidth: true, imageFormat: 'webp'}" priority
             class="
               opacity-0 will-change-transform
               dark:opacity-100
             "
             alt="">
      </div>
    </div>
  </div>
</section>
